# ConfigMaps: each backend returns a fixed string for any path.
# Traefik does not strip the path prefix on plain Ingress rules — the backend
# receives the full URL path (e.g. /app or /api). Using a custom nginx conf that
# returns a fixed response for any location avoids 404s caused by the full path
# not matching files on disk.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-nginx-conf
  namespace: fl-k8s-0127
data:
  default.conf: |
    server {
        listen 80;
        location / {
            default_type text/plain;
            return 200 "app-response";
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-nginx-conf
  namespace: fl-k8s-0127
data:
  default.conf: |
    server {
        listen 80;
        location / {
            default_type text/plain;
            return 200 "api-response";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: fl-k8s-0127
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: app-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: fl-k8s-0127
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fl-k8s-0127
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: api-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0127
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0127
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
---
# Ingress: only /app route pre-configured. Learner must add /api.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: fl-k8s-0127
spec:
  ingressClassName: traefik
  rules:
    - host: k8s-0127.fl.test
      http:
        paths:
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
