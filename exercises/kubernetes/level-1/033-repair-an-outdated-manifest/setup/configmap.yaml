apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-manifest
  namespace: fl-k8s-0033
data:
  deployment.yaml: |
    apiVersion: apps/v1beta1
    kind: Deployment
    metadata:
      name: legacy-worker
      namespace: fl-k8s-0033
      labels:
        app: legacy-worker
    spec:
      replicas: 1
      template:
        metadata:
          labels:
            app: legacy-worker
        spec:
          terminationGracePeriodSeconds: 2
          containers:
            - name: worker
              image: nginx:1.27
