# ── Server in fl-k8s-0163 (the namespace to isolate) ──────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0163
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0163
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
# ── Client used to verify egress isolation ────────────────────────────────────
# deny-client is in fl-k8s-0163. Once isolate-namespace is applied, its egress
# is blocked (DNS fails → curl exit 6), confirming the namespace is quarantined.
apiVersion: v1
kind: Pod
metadata:
  name: deny-client
  namespace: fl-k8s-0163
  labels:
    app: deny-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sleep", "86400"]
---
# ── Safe client in fl-k8s-0163-safe ──────────────────────────────────────────
# safe-client is outside the quarantined namespace. Listed for manual testing.
# Not used in graded checks (cross-namespace traffic-blocked not supported).
apiVersion: v1
kind: Pod
metadata:
  name: safe-client
  namespace: fl-k8s-0163-safe
  labels:
    app: safe-client
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "86400"]
