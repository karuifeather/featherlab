apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  namespace: fl-k8s-0016
  labels: { app: reports }
spec:
  replicas: 1
  selector:
    matchLabels: { app: reports }
  template:
    metadata:
      labels: { app: reports }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - { name: web, image: nginx:1.27 }
