apiVersion: apps/v1
kind: Deployment
metadata:
  name: greedy-app
  namespace: fl-k8s-0096
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greedy-app
  template:
    metadata:
      labels:
        app: greedy-app
    spec:
      containers:
        - name: app
          image: nginx:1.27
          resources:
            requests:
              cpu: "100"
              memory: "64Mi"
            limits:
              cpu: "100"
              memory: "128Mi"
