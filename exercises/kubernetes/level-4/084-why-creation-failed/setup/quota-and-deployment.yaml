apiVersion: v1
kind: ResourceQuota
metadata:
  name: tight-budget
  namespace: fl-k8s-0084
spec:
  hard:
    limits.cpu: "200m"
    limits.memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fl-k8s-0084
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: app
          image: nginx:1.27
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
