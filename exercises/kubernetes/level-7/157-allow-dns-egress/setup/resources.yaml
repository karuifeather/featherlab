apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0157
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0157
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: deny-client
  namespace: fl-k8s-0157
  labels:
    app: deny-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sh", "-c", "sleep infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0157
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
---
# ConfigMap: hint for discovering the kube-dns ClusterIP
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-info
  namespace: fl-k8s-0157
data:
  dns-ip: "10.96.0.10"
  dns-discovery-cmd: "kubectl get svc kube-dns -n kube-system -o jsonpath='{.spec.clusterIP}'"
---
# Pre-existing policy: blocks all egress from deny-client
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-egress-client
  namespace: fl-k8s-0157
spec:
  podSelector:
    matchLabels:
      app: deny-client
  policyTypes:
    - Egress
