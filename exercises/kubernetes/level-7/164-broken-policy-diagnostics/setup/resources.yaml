# ── Server ─────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0164
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0164
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
# ── Authorized client (role: admin) ───────────────────────────────────────────
# grader-client has role: admin. The broken allow-admin policy uses role: adminn
# (double n), so this pod is incorrectly blocked until the typo is fixed.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0164
  labels:
    app: grader-client
    role: admin
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "86400"]
---
# ── Unauthorized client (no role label) ──────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: deny-client
  namespace: fl-k8s-0164
  labels:
    app: deny-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sleep", "86400"]
---
# ── Default-deny ingress ───────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: fl-k8s-0164
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# ── Broken allow policy — podSelector has a typo: role: adminn (double n) ─────
# Learner must fix "adminn" → "admin" to allow grader-client.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin
  namespace: fl-k8s-0164
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: adminn
