schemaVersion: 1
id: k8s-0062
type: task
title: Sidecar and Shared Files
summary: Create a Deployment where a native sidecar and the main container share an emptyDir volume.
track: kubernetes
level: 3
order: 10
difficulty: intermediate
estimatedMinutes: 12
tags: [deployments, init-containers, native-sidecar, emptydir, volumes]
prerequisites: [k8s-0061]

environment:
  profile: kind-default

content:
  description: description.md
  solution: solution.md

requirements:
  - "Namespace: `fl-k8s-0062`"
  - "Deployment name: `app`"
  - "Main container name: `app`, image: `nginx:1.27`"
  - "Native sidecar name: `log-collector`, image: `busybox:1.36`"
  - "`log-collector` must be in `initContainers[]` with `restartPolicy: Always`"
  - "Both containers must mount a shared `emptyDir` volume named `logs`"
  - "Deployment must roll out successfully"

hints:
  - "Declare the emptyDir volume under `spec.template.spec.volumes: [{name: logs, emptyDir: {}}]`. Then add a `volumeMounts` entry in both the `log-collector` initContainer and the `app` container pointing to the same volume name."
  - "The `log-collector` sidecar entry needs `restartPolicy: Always` to be a native sidecar. Without it, Kubernetes treats it as a regular init container that must complete before the main container starts."
  - "Run `kubectl get deploy app -n fl-k8s-0062 -o jsonpath='{.spec.template.spec.volumes}'` to confirm the volumes field is set, and check `kubectl rollout status deployment/app -n fl-k8s-0062` for readiness."

lifecycle:
  namespaces: [fl-k8s-0062]

checks:
  - id: sidecar
    type: k8s.init-container
    label: Deployment app has native sidecar log-collector
    params:
      kind: Deployment
      name: app
      namespace: fl-k8s-0062
      container: log-collector
      image: "busybox:1.36"
      nativeSidecar: true
  - id: shared-vol
    type: k8s.shared-emptydir
    label: Containers app and log-collector share an emptyDir volume
    params:
      kind: Deployment
      name: app
      namespace: fl-k8s-0062
      containers: [app, log-collector]
  - id: rollout
    type: k8s.rollout-complete
    label: Deployment app is fully rolled out
    params:
      name: app
      namespace: fl-k8s-0062
      replicas: 1
