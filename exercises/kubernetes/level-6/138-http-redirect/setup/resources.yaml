apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: fl-k8s-0138
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 'current-site';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fl-k8s-0138
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: web-config
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: fl-k8s-0138
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
# Grader-owned client Pod for routing probes; learners do not create this.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0138
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gw
  namespace: fl-k8s-0138
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "app.k8s-0138.fl.test"
---
# Only the /current rule is pre-configured; the /old redirect rule is missing.
# Learner task: add a rule that redirects /old to /current with HTTP 301.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
  namespace: fl-k8s-0138
spec:
  parentRefs:
    - name: web-gw
  hostnames:
    - "app.k8s-0138.fl.test"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /current
      backendRefs:
        - name: web
          port: 80
