apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  namespace: fl-k8s-0107
  labels:
    app: reports
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      labels:
        app: reports
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
# Service with intentional selector typo: "report" instead of "reports"
apiVersion: v1
kind: Service
metadata:
  name: reports
  namespace: fl-k8s-0107
spec:
  selector:
    app: report
  ports:
    - port: 80
      targetPort: 80
