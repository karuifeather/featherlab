apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fl-k8s-0102
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
# Service with intentional selector typo: "fontend" instead of "frontend"
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fl-k8s-0102
spec:
  selector:
    app: fontend
  ports:
    - port: 80
      targetPort: 80
