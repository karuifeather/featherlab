schemaVersion: 1
id: k8s-0068
type: task
title: Multiple Completions and Parallelism
summary: Create a Job that runs multiple Pods in parallel to reach a target completion count.
track: kubernetes
level: 3
order: 16
difficulty: intermediate
estimatedMinutes: 12
tags: [jobs, batch, parallelism, completions]
prerequisites: [k8s-0067]

environment:
  profile: kind-default

content:
  description: description.md
  solution: solution.md

requirements:
  - "Namespace: `fl-k8s-0068`"
  - "Job name: `worker`"
  - "Container image: `busybox:1.36`"
  - "Command: `sh -c 'echo worker-done'`"
  - "Set `completions: 4` (4 successful Pods required)"
  - "Set `parallelism: 2` (run 2 Pods at a time)"
  - "Pod restartPolicy: `Never`"
  - "Job must complete all 4 completions"

hints:
  - "Set `spec.completions: 4` and `spec.parallelism: 2` in your Job manifest. Kubernetes will run 2 Pods at a time and keep launching new ones until 4 have succeeded."
  - 'To create imperatively: `kubectl create job worker --image=busybox:1.36 -n fl-k8s-0068 -- sh -c ''echo worker-done''` then patch: `kubectl patch job worker -n fl-k8s-0068 -p ''{"spec":{"completions":4,"parallelism":2}}''`. A declarative manifest is cleaner.'
  - "Watch progress with `kubectl get job worker -n fl-k8s-0068 -w`. The COMPLETIONS column will increment as Pods finish. When it reaches `4/4`, the Job is complete."

lifecycle:
  namespaces: [fl-k8s-0068]

checks:
  - id: exists
    type: k8s.resource-in-namespace
    label: Job worker exists in fl-k8s-0068
    params: { kind: Job, name: worker, namespace: fl-k8s-0068 }
  - id: config
    type: k8s.job-config
    label: Job worker has completions 4 and parallelism 2
    params:
      name: worker
      namespace: fl-k8s-0068
      completions: 4
      parallelism: 2
  - id: complete
    type: k8s.job-complete
    label: Job worker has completed all 4 runs
    params: { name: worker, namespace: fl-k8s-0068 }
