# ── Server: api in fl-k8s-0161 ────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0161
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0161
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
# ── Blocked client in the same namespace ──────────────────────────────────────
# deny-client has no matching labels for the allow rule; remains blocked after the fix.
apiVersion: v1
kind: Pod
metadata:
  name: deny-client
  namespace: fl-k8s-0161
  labels:
    app: deny-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sleep", "86400"]
---
# ── Pre-existing default-deny ingress ─────────────────────────────────────────
# Blocks all ingress to all pods in fl-k8s-0161.
# Learner must create allow-from-staging to lift the block for cross-ns-client.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: fl-k8s-0161
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# ── Cross-namespace client in fl-k8s-0161-client ──────────────────────────────
# Uses the auto-label kubernetes.io/metadata.name=fl-k8s-0161-client for the
# namespaceSelector. No custom labels needed.
apiVersion: v1
kind: Pod
metadata:
  name: cross-ns-client
  namespace: fl-k8s-0161-client
  labels:
    app: cross-ns-client
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "86400"]
