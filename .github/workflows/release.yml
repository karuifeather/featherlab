name: Release npm CLI and workstation image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  workstation:
    name: Build and push workstation image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: "${{ steps.coords.outputs.name }}:${{ steps.coords.outputs.version }}"
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          if [ "${GITHUB_REF_NAME}" != "v${PKG_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${PKG_VERSION}" >&2
            exit 1
          fi
      - name: Image coordinates
        id: coords
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/featherlab-workstation" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.coords.outputs.name }}:${{ steps.coords.outputs.version }}
            ${{ steps.coords.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=featherlab Workstation

  npm:
    name: Publish to npm
    needs: [workstation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
