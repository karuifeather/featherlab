apiVersion: apps/v1
kind: Deployment
metadata:
  name: stuck-app
  namespace: fl-k8s-0089
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stuck-app
  template:
    metadata:
      labels:
        app: stuck-app
    spec:
      nodeSelector:
        kubernetes.io/os: "windows" # No Windows node in the cluster!
      containers:
        - name: app
          image: nginx:1.27
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
