apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0153
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0153
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
# grader-client carries role=frontend so the learner's allow-frontend policy admits it.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0153
  labels:
    app: grader-client
    role: frontend
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
---
# deny-client has no role=frontend label so it must remain blocked after allow-frontend is created.
apiVersion: v1
kind: Pod
metadata:
  name: deny-client
  namespace: fl-k8s-0153
  labels:
    app: deny-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sh", "-c", "sleep infinity"]
---
# Pre-existing default-deny policy: the learner must add allow-frontend on top of this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: fl-k8s-0153
spec:
  podSelector: {}
  policyTypes:
    - Ingress
