apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: fl-k8s-0140
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 'web-response';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fl-k8s-0140
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: web-config
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: fl-k8s-0140
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
# Grader-owned client Pod for routing probes; learners do not create this.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0140
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
---
# Pre-created TLS Secret using a synthetic certificate for app.k8s-0140.fl.test.
# Learner task: reference this Secret in the Ingress TLS stanza.
apiVersion: v1
kind: Secret
metadata:
  name: app-tls
  namespace: fl-k8s-0140
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
# Ingress WITHOUT a TLS stanza — learner must add the TLS section.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: fl-k8s-0140
spec:
  ingressClassName: traefik
  rules:
    - host: app.k8s-0140.fl.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
