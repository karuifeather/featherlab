apiVersion: apps/v1
kind: Deployment
metadata:
  name: store
  namespace: fl-k8s-0104
  labels:
    app: store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store
  template:
    metadata:
      labels:
        app: store
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: store
  namespace: fl-k8s-0104
spec:
  selector:
    app: store
  ports:
    - port: 80
      targetPort: 80
