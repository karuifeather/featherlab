apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fl-k8s-0020
  labels:
    app: frontend
    env: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: web
          image: nginx:1.27
