apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fl-k8s-0115
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
# Service is intentionally misconfigured: targetPort 9090 does not match nginx's containerPort 80.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0115
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 9090
---
# Grader-owned client Pod for HTTP probe; the learner does not need to create this.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0115
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
