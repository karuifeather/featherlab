apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: fl-k8s-0136
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 'app-response';
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: fl-k8s-0136
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 'api-response';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: fl-k8s-0136
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: app-config
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: fl-k8s-0136
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fl-k8s-0136
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: api-config
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0136
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
# Grader-owned client Pod for routing probes; learners do not create this.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0136
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gw
  namespace: fl-k8s-0136
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "app.k8s-0136.fl.test"
---
# BUG: The /api rule routes to the wrong backend (app:80 instead of api:80).
# Learner task: fix the /api backendRef to point to api:80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
  namespace: fl-k8s-0136
spec:
  parentRefs:
    - name: web-gw
  hostnames:
    - "app.k8s-0136.fl.test"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /app
      backendRefs:
        - name: app
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        # WRONG: this should be api:80, not app:80
        - name: app
          port: 80
