apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: fl-k8s-0108
  labels:
    app: inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
# Service intentionally misconfigured: targetPort 9090 but nginx listens on 80
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: fl-k8s-0108
spec:
  selector:
    app: inventory
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0108
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
