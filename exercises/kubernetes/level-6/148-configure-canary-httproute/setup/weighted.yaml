apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-stable
  namespace: fl-k8s-0148
  labels:
    app: web
    version: stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: stable
  template:
    metadata:
      labels:
        app: web
        version: stable
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
  namespace: fl-k8s-0148
  labels:
    app: web
    version: canary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: canary
  template:
    metadata:
      labels:
        app: web
        version: canary
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-stable
  namespace: fl-k8s-0148
spec:
  selector:
    app: web
    version: stable
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-canary
  namespace: fl-k8s-0148
spec:
  selector:
    app: web
    version: canary
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app-gw
  namespace: fl-k8s-0148
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "app.k8s-0148.fl.test"
---
# HTTPRoute starts with 100% traffic to web-stable.
# The learner must add web-canary as a second backendRef and set weights 90/10.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-route
  namespace: fl-k8s-0148
spec:
  parentRefs:
    - name: app-gw
  hostnames:
    - "app.k8s-0148.fl.test"
  rules:
    - backendRefs:
        - name: web-stable
          port: 80
          weight: 100
---
# Grader client pod for routing probes.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0148
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
