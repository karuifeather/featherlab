schemaVersion: 1
id: k8s-0069
type: task
title: Retry and Deadline Controls
summary: Create a Job with explicit retry limits and a total time budget to prevent runaway workloads.
track: kubernetes
level: 3
order: 17
difficulty: intermediate
estimatedMinutes: 12
tags: [jobs, batch, backoff-limit, active-deadline, reliability]
prerequisites: [k8s-0068]

environment:
  profile: kind-default

content:
  description: description.md
  solution: solution.md

requirements:
  - "Namespace: `fl-k8s-0069`"
  - "Job name: `safe-task`"
  - "Container image: `busybox:1.36`"
  - "Command: `sh -c 'echo safe-done'`"
  - "Set `backoffLimit: 3` (retry up to 3 times on failure)"
  - "Set `activeDeadlineSeconds: 60` (abort the entire Job after 60 s)"
  - "Pod restartPolicy: `Never`"
  - "Job must complete successfully"

hints:
  - "`spec.backoffLimit` limits how many times Kubernetes retries failed Pods before marking the Job as failed. `spec.activeDeadlineSeconds` sets a wall-clock time limit from the Job's start time — if the Job hasn't finished by then, it is terminated regardless of backoff state."
  - "Declare both fields in the Job manifest: `spec.backoffLimit: 3` and `spec.activeDeadlineSeconds: 60`. These are Job-level fields, not Pod-level."
  - "After creating, check the job: `kubectl get job safe-task -n fl-k8s-0069`. For a fast command like `echo`, it completes well within 60 seconds. If it times out, the Job condition will be `DeadlineExceeded`."

lifecycle:
  namespaces: [fl-k8s-0069]

checks:
  - id: exists
    type: k8s.resource-in-namespace
    label: Job safe-task exists in fl-k8s-0069
    params: { kind: Job, name: safe-task, namespace: fl-k8s-0069 }
  - id: config
    type: k8s.job-config
    label: Job safe-task has backoffLimit 3 and activeDeadlineSeconds 60
    params:
      name: safe-task
      namespace: fl-k8s-0069
      backoffLimit: 3
      activeDeadlineSeconds: 60
  - id: complete
    type: k8s.job-complete
    label: Job safe-task has completed successfully
    params: { name: safe-task, namespace: fl-k8s-0069 }
