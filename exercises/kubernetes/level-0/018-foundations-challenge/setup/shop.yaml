apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: fl-k8s-0018
  labels: { app: shop, env: staging }
spec:
  replicas: 1
  selector:
    matchLabels: { app: shop }
  template:
    metadata:
      labels: { app: shop }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - { name: web, image: nginx:1.27 }
---
apiVersion: v1
kind: Pod
metadata:
  name: batch-1
  namespace: fl-k8s-0018
  labels: { app: batch }
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: job
      image: nginx:1.27
      command: ["sh", "-c", "echo 'owner: search team'; exec sleep infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: batch-2
  namespace: fl-k8s-0018
  labels: { app: batch }
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: job
      image: nginx:1.27
      command: ["sh", "-c", "echo 'owner: payments team'; exec sleep infinity"]
