apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0154
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0154
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0154
  labels:
    app: grader-client
    role: client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
---
# Pre-existing default-deny: the learner must add allow-port-80 to restore port-80 access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: fl-k8s-0154
spec:
  podSelector: {}
  policyTypes:
    - Ingress
