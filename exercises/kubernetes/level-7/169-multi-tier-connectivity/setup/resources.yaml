# ── Frontend tier ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: fl-k8s-0169
  labels:
    app: frontend
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fl-k8s-0169
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
# ── Backend tier ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: fl-k8s-0169
  labels:
    app: backend
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: fl-k8s-0169
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 80
---
# ── External client (busybox, wget) — represents a legitimate user ─────────────
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0169
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "86400"]
---
# ── Attacker client (curl) — should NOT reach backend directly ────────────────
apiVersion: v1
kind: Pod
metadata:
  name: deny-client
  namespace: fl-k8s-0169
  labels:
    app: deny-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sleep", "86400"]
