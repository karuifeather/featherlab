schemaVersion: 1
id: k8s-0039
type: task
title: Mount a ConfigMap as a Volume
summary: Expose ConfigMap data as files inside a container by mounting it as a volume.
track: kubernetes
level: 2
order: 5
difficulty: intermediate
estimatedMinutes: 12
tags: [configmaps, volumes, mounts, deployments, kubectl]
prerequisites: [k8s-0038]

environment:
  profile: kind-default

content:
  description: description.md
  solution: solution.md

requirements:
  - "Namespace: `fl-k8s-0039`"
  - "Deployment `app` rolls out with 1 available replica"
  - "Container `app` mounts ConfigMap `nginx-conf` as a volume"

hints:
  - "Mounting a ConfigMap as a volume takes two steps: add a volume to `spec.template.spec.volumes` referencing the ConfigMap, then add a `volumeMount` to the container pointing to that volume."
  - "Use **`kubectl edit deployment app -n fl-k8s-0039`** to add both the volume and the mount in one edit."
  - "Mount at a path nginx does not auto-load (such as `/etc/nginx/custom`) to avoid conflicting with the default config. Mounting onto `/etc/nginx/conf.d/` hides the directory's existing contents."

lifecycle:
  namespaces: [fl-k8s-0039]
  setup:
    manifests: [setup/configmap.yaml, setup/deployment.yaml]

checks:
  - id: rollout
    type: k8s.rollout-complete
    label: Deployment app rolled out with 1 available replica
    params: { name: app, namespace: fl-k8s-0039, replicas: 1 }
  - id: mounted
    type: k8s.configmap-mounted
    label: Container app mounts ConfigMap nginx-conf
    weight: 2
    params:
      kind: Deployment
      name: app
      namespace: fl-k8s-0039
      container: app
      configMap: nginx-conf
