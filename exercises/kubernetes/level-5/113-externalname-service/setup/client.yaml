# Grader-owned client Pod for optional manual testing.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0113
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
