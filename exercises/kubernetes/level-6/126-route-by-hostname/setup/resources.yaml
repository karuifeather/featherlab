apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: fl-k8s-0126
data:
  index.html: |-
    <html><body>frontend</body></html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-html
  namespace: fl-k8s-0126
data:
  index.html: |-
    <html><body>api-backend</body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fl-k8s-0126
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: frontend-html
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fl-k8s-0126
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fl-k8s-0126
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: api-html
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0126
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0126
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
---
# Ingress with frontend rule only — learner must add the api rule
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: fl-k8s-0126
spec:
  ingressClassName: traefik
  rules:
    - host: frontend.k8s-0126.fl.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
