apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fl-k8s-0048
  labels: { app: api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: api
          image: nginx:1.27
          ports: [{ name: http, containerPort: 80 }]
