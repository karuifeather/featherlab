apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: fl-k8s-0063
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: nginx:1.27
        - name: helper
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo helper; sleep 10; done"]
