apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: fl-k8s-0081
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
        - name: gateway
          image: nginx:1.27
        - name: sidecar
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
