apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fl-k8s-0100
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
# Service intentionally misconfigured: port 80→80 instead of 8080→80
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0100
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
