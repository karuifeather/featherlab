apiVersion: batch/v1
kind: Job
metadata:
  name: data-processor
  namespace: fl-k8s-0066
spec:
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      containers:
        - name: processor
          image: busybox:1.36
          command: ["sh", "-c", "echo processing data; sleep 2; echo done"]
