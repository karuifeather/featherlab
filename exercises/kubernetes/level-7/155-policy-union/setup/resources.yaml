apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0155
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0155
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
# grader-client: allowed by the pre-existing allow-grader-a policy.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0155
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
---
# grader-client-b: blocked until the learner creates allow-grader-b.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client-b
  namespace: fl-k8s-0155
  labels:
    app: grader-client-b
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
---
# deny-client: must remain blocked regardless — not matched by either allow policy.
apiVersion: v1
kind: Pod
metadata:
  name: deny-client
  namespace: fl-k8s-0155
  labels:
    app: deny-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sh", "-c", "sleep infinity"]
---
# Pre-existing deny-all policy: blocks all ingress unless an allow policy overrides it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: fl-k8s-0155
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Pre-existing allow-grader-a: already allows grader-client (app=grader-client).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grader-a
  namespace: fl-k8s-0155
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grader-client
