apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: fl-k8s-0030
  labels:
    app: gateway
  annotations:
    kubernetes.io/change-cause: "upgrade to nginx:1.27-alpne"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: proxy
          image: nginx:1.27-alpne
