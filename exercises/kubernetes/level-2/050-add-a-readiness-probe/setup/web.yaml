# Deployment with no readiness probe — the learner will add one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fl-k8s-0050
  labels: { app: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: nginx:1.27
          ports: [{ containerPort: 80 }]
