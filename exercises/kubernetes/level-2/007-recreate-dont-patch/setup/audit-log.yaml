# A bare Pod (no controller), so it is not recreated automatically.
# Container env is immutable on a running Pod.
apiVersion: v1
kind: Pod
metadata:
  name: audit-log
  namespace: fl-k8s-0007
  labels: { app: audit-log, team: platform }
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: app
      image: nginx:1.27
      ports: [{ name: http, containerPort: 80 }]
      env:
        - { name: LOG_LEVEL, value: info }
---
apiVersion: v1
kind: Service
metadata:
  name: audit-log
  namespace: fl-k8s-0007
spec:
  selector: { app: audit-log, team: platform }
  ports:
    - { name: http, port: 80, targetPort: http }
