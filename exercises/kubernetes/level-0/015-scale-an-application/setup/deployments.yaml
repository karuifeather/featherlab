apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fl-k8s-0015
  labels: { app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - { name: web, image: nginx:1.27 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fl-k8s-0015
  labels: { app: worker }
spec:
  replicas: 3
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - { name: web, image: nginx:1.27 }
