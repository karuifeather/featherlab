# ── Server ─────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0168
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0168
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
# ── Authorized client (role: frontend) ───────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0168
  labels:
    app: grader-client
    role: frontend
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "86400"]
---
# ── Unauthorized client ────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: deny-client
  namespace: fl-k8s-0168
  labels:
    app: deny-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sleep", "86400"]
---
# ── Broken NetworkPolicy ───────────────────────────────────────────────────────
# BUG: policyTypes lists only [Egress]. Without Ingress in policyTypes,
# Kubernetes ignores the ingress rules entirely, so the `from` selector never
# takes effect and both clients are treated as unrestricted ingress.
# (There is no default-deny either, so both can reach api.)
# Learner must add Ingress to policyTypes to activate the ingress rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-buggy
  namespace: fl-k8s-0168
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: frontend
