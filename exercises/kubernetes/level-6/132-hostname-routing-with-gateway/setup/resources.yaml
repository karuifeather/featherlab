apiVersion: v1
kind: ConfigMap
metadata:
  name: v1-html
  namespace: fl-k8s-0132
data:
  index.html: |
    v1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: v2-html
  namespace: fl-k8s-0132
data:
  index.html: |
    v2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: v1
  namespace: fl-k8s-0132
  labels:
    app: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: v1
  template:
    metadata:
      labels:
        app: v1
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: html
          configMap:
            name: v1-html
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: v2
  namespace: fl-k8s-0132
  labels:
    app: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: v2
  template:
    metadata:
      labels:
        app: v2
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: html
          configMap:
            name: v2-html
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: v1
  namespace: fl-k8s-0132
spec:
  selector:
    app: v1
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: v2
  namespace: fl-k8s-0132
spec:
  selector:
    app: v2
  ports:
    - port: 80
      targetPort: 80
---
# Grader-owned client Pod for routing probes; the learner does not create this.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0132
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
---
# Gateway accepts routes for any subdomain of k8s-0132.fl.test.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gw
  namespace: fl-k8s-0132
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.k8s-0132.fl.test"
---
# v1-route is pre-configured and working; learner must create v2-route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: v1-route
  namespace: fl-k8s-0132
spec:
  parentRefs:
    - name: web-gw
  hostnames:
    - "v1.k8s-0132.fl.test"
  rules:
    - backendRefs:
        - name: v1
          port: 80
