apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: fl-k8s-0139
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 'main-app';
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-config
  namespace: fl-k8s-0139
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 'admin-panel';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: fl-k8s-0139
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: app-config
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: fl-k8s-0139
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: fl-k8s-0139
  labels:
    app: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: admin-config
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: fl-k8s-0139
spec:
  selector:
    app: admin
  ports:
    - port: 80
      targetPort: 80
---
# Grader-owned client Pod for routing probes; learners do not create this.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0139
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gw
  namespace: fl-k8s-0139
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "app.k8s-0139.fl.test"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-route
  namespace: fl-k8s-0139
spec:
  parentRefs:
    - name: web-gw
  hostnames:
    - "app.k8s-0139.fl.test"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: app
          port: 80
---
# BUG: Both app-route and admin-route match PathPrefix "/", causing a conflict.
# Learner task: fix admin-route to match PathPrefix "/admin" instead of "/".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-route
  namespace: fl-k8s-0139
spec:
  parentRefs:
    - name: web-gw
  hostnames:
    - "app.k8s-0139.fl.test"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: admin
          port: 80
