# Backend namespace resources: Deployment, Service, and custom HTML.
# The ReferenceGrant is intentionally absent — the learner must create it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-html
  namespace: fl-k8s-0144-backend
data:
  index.html: |
    backend-0144
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fl-k8s-0144-backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: html
          configMap:
            name: backend-html
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: fl-k8s-0144-backend
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 80
---
# HTTPRoute namespace resources: Gateway, HTTPRoute, and grader-client.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gw
  namespace: fl-k8s-0144
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "app.k8s-0144.fl.test"
---
# This HTTPRoute references a Service in fl-k8s-0144-backend.
# Without a ReferenceGrant in that namespace, ResolvedRefs will be False.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
  namespace: fl-k8s-0144
spec:
  parentRefs:
    - name: main-gw
  hostnames:
    - "app.k8s-0144.fl.test"
  rules:
    - backendRefs:
        - name: backend
          namespace: fl-k8s-0144-backend
          port: 80
---
# Grader-owned client Pod for routing probes; the learner does not create this.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0144
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
