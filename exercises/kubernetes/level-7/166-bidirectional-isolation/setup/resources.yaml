# ── API server ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0166
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0166
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
# ── The client pod to be isolated ─────────────────────────────────────────────
# Learner creates isolate-client targeting app=client. Before the policy,
# this pod can freely reach api. After the policy, it is fully isolated.
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: fl-k8s-0166
  labels:
    app: client
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sleep", "86400"]
---
# ── Grader client (not affected by the isolation policy) ──────────────────────
# grader-client does NOT have app=client, so isolate-client does not affect it.
# It can still reach api freely after the isolation policy is created.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0166
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "86400"]
