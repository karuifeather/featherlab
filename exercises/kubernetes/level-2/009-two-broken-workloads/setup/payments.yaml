# payments references a ConfigMap name that does not exist ("payment-config"), so its
# containers cannot be created (CreateContainerConfigError).
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: fl-k8s-0009
data:
  mode: sandbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: fl-k8s-0009
  labels: { app: payments }
spec:
  replicas: 2
  selector:
    matchLabels: { app: payments }
  template:
    metadata:
      labels: { app: payments }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: nginx:1.27
          ports: [{ name: http, containerPort: 80 }]
          env:
            - name: PAYMENT_MODE
              valueFrom:
                configMapKeyRef: { name: payment-config, key: mode }
