schemaVersion: 1
id: k8s-0058
type: task
title: Prepare Shared Files
summary: Use an init container to write a file into a shared emptyDir volume that the main container reads.
track: kubernetes
level: 3
order: 6
difficulty: intermediate
estimatedMinutes: 12
tags: [deployments, init-containers, emptydir, volumes]
prerequisites: [k8s-0057]

environment:
  profile: kind-default

content:
  description: description.md
  solution: solution.md

requirements:
  - "Namespace: `fl-k8s-0058`"
  - "Deployment name: `app`"
  - "Volume name: `shared-data` (emptyDir)"
  - "Init container name: `writer`, image: `busybox:1.36`, writes `hello from init` to `/shared/index.html`"
  - "Main container name: `app`, image: `nginx:1.27`, mounts `shared-data` at `/usr/share/nginx/html`"
  - "Deployment must roll out with 1 available replica"

hints:
  - "Both the init container and the main container must declare a `volumeMount` for the same volume name to share data."
  - "An emptyDir volume is declared at the pod level under `spec.volumes[]` with `emptyDir: {}`."
  - "The init container's command to write the file: `sh -c 'echo hello from init > /shared/index.html'`."

lifecycle:
  namespaces: [fl-k8s-0058]

checks:
  - id: init
    type: k8s.init-container
    label: Deployment app has an init container named writer
    params: { kind: Deployment, name: app, namespace: fl-k8s-0058, container: writer }
  - id: shared
    type: k8s.shared-emptydir
    label: Init container writer and main container app share an emptyDir volume
    params: { kind: Deployment, name: app, namespace: fl-k8s-0058, containers: [writer, app] }
  - id: rollout
    type: k8s.rollout-complete
    label: Deployment app rolled out with 1 available replica
    params: { name: app, namespace: fl-k8s-0058, replicas: 1 }
