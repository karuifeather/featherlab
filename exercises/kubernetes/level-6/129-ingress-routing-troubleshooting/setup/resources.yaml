apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: fl-k8s-0129
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
# Service listens on port 8080 and forwards to nginx on port 80
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: fl-k8s-0129
spec:
  selector:
    app: app
  ports:
    - port: 8080
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0129
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
---
# Ingress with wrong ingressClassName: nginx (should be traefik).
# Traefik ignores Ingress objects owned by a different class.
# The backend port (8080) is correct and matches the Service's spec.ports[].port.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: fl-k8s-0129
spec:
  ingressClassName: nginx
  rules:
    - host: app.k8s-0129.fl.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 8080
