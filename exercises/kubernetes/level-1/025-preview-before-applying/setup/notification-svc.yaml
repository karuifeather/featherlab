apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-svc
  namespace: fl-k8s-0025
  labels:
    app: notification-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-svc
  template:
    metadata:
      labels:
        app: notification-svc
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: web
          image: nginx:1.27
