# ── Server in fl-k8s-0165 ─────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0165
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0165
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
# ── Graded deny-client in fl-k8s-0165 (same namespace as api) ─────────────────
# Used for the same-ns-blocked check. Since it has no matching namespaceSelector,
# it should be blocked even after allow-from-frontend is applied.
apiVersion: v1
kind: Pod
metadata:
  name: deny-client
  namespace: fl-k8s-0165
  labels:
    app: deny-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sleep", "86400"]
---
# ── Default-deny ingress in fl-k8s-0165 ───────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: fl-k8s-0165
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# ── frontend-client in fl-k8s-0165-frontend ──────────────────────────────────
# The namespaceSelector should match this namespace via kubernetes.io/metadata.name.
apiVersion: v1
kind: Pod
metadata:
  name: frontend-client
  namespace: fl-k8s-0165-frontend
  labels:
    app: frontend-client
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "86400"]
---
# ── backend-client in fl-k8s-0165-backend ────────────────────────────────────
# Listed for manual verification: backend-client should NOT reach api.
# Not used in graded checks (cross-namespace traffic-blocked not supported by validator).
apiVersion: v1
kind: Pod
metadata:
  name: backend-client
  namespace: fl-k8s-0165-backend
  labels:
    app: backend-client
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "86400"]
