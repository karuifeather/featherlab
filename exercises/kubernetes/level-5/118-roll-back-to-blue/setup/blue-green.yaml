apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
  namespace: fl-k8s-0118
  labels:
    app: web
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
      version: blue
  template:
    metadata:
      labels:
        app: web
        version: blue
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-green
  namespace: fl-k8s-0118
  labels:
    app: web
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: green
  template:
    metadata:
      labels:
        app: web
        version: green
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service starts routing to green (simulating a release that just went out).
# The learner must roll back to blue.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: fl-k8s-0118
spec:
  selector:
    app: web
    version: green
  ports:
    - port: 80
      targetPort: 80
---
# Grader-owned client Pod for HTTP probe; the learner does not need to create this.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0118
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
