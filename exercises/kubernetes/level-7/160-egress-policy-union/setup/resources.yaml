apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0160
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0160
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: secondary
  namespace: fl-k8s-0160
  labels:
    app: secondary
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: secondary
  namespace: fl-k8s-0160
spec:
  selector:
    app: secondary
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: deny-client
  namespace: fl-k8s-0160
  labels:
    app: deny-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sh", "-c", "sleep infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0160
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
---
# Pre-existing: blocks all egress from deny-client
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-egress-client
  namespace: fl-k8s-0160
spec:
  podSelector:
    matchLabels:
      app: deny-client
  policyTypes:
    - Egress
---
# Pre-existing: allows DNS egress from deny-client
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: fl-k8s-0160
spec:
  podSelector:
    matchLabels:
      app: deny-client
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.96.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Pre-existing: allows egress from deny-client to api on port 80
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress
  namespace: fl-k8s-0160
spec:
  podSelector:
    matchLabels:
      app: deny-client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 80
