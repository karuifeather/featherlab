apiVersion: v1
kind: ConfigMap
metadata:
  name: app-html
  namespace: fl-k8s-0133
data:
  index.html: |
    app-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-html
  namespace: fl-k8s-0133
data:
  index.html: |
    api-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: fl-k8s-0133
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: html
          configMap:
            name: app-html
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            # Mount at /usr/share/nginx/html/app so GET /app/ serves index.html
            - name: html
              mountPath: /usr/share/nginx/html/app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /app/
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fl-k8s-0133
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: html
          configMap:
            name: api-html
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            # Mount at /usr/share/nginx/html/api so GET /api/ serves index.html
            - name: html
              mountPath: /usr/share/nginx/html/api
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: fl-k8s-0133
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0133
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
# Grader-owned client Pod for routing probes; the learner does not create this.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0133
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gw
  namespace: fl-k8s-0133
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "k8s-0133.fl.test"
---
# Only the /app rule is pre-configured; the /api rule is missing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
  namespace: fl-k8s-0133
spec:
  parentRefs:
    - name: web-gw
  hostnames:
    - "k8s-0133.fl.test"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /app
      backendRefs:
        - name: app
          port: 80
