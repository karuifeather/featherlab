schemaVersion: 1
id: k8s-0078
type: task
title: Application Patterns Mastery
summary: Diagnose and fix a broken platform using all the controller types learned in Level 3 — Deployments with init containers, Jobs, CronJobs, and DaemonSets.
track: kubernetes
level: 3
order: 26
difficulty: intermediate
estimatedMinutes: 25
tags: [deployments, jobs, cronjobs, daemonsets, init-containers]
prerequisites: [k8s-0077]

environment:
  profile: kind-default

content:
  description: description.md
  solution: solution.md

requirements:
  - "Namespace: `fl-k8s-0078`"
  - "Deployment `api` init container `config-load` uses image `busybox:1.36` and Deployment is rolled out"
  - "Job `data-fix` has completed (image `busybox:1.36`, command: `echo 'data fixed'`)"
  - "CronJob `archiver` has schedule `0 0 * * 0` (every Sunday at midnight)"
  - "DaemonSet `metrics` has all Pods ready (image `busybox:1.36`)"

hints:
  - "Check `kubectl get pods -n fl-k8s-0078` — Pods in `Init:ImagePullBackOff` indicate a bad init container image; edit the Deployment to fix it."
  - "The archiver CronJob schedule `0 0 31 2 *` means Feb 31 — an impossible date. Patch it to `0 0 * * 0` (every Sunday midnight)."
  - "Fix the DaemonSet image with `kubectl set image daemonset/metrics collector=busybox:1.36 -n fl-k8s-0078`. Then create Job `data-fix`: `kubectl create job data-fix --image=busybox:1.36 -n fl-k8s-0078 -- sh -c 'echo data fixed'`."

lifecycle:
  namespaces: [fl-k8s-0078]
  setup:
    manifests: [setup/platform.yaml]

checks:
  - id: api-init
    type: k8s.init-container
    label: Deployment api init container config-load uses busybox:1.36
    params:
      kind: Deployment
      name: api
      namespace: fl-k8s-0078
      container: config-load
      image: "busybox:1.36"
  - id: api-rollout
    type: k8s.rollout-complete
    label: Deployment api is rolled out
    params: { name: api, namespace: fl-k8s-0078, replicas: 1 }
  - id: data-fix-complete
    type: k8s.job-complete
    label: Job data-fix has completed
    params: { name: data-fix, namespace: fl-k8s-0078 }
  - id: archiver-schedule
    type: k8s.cronjob-config
    label: CronJob archiver has schedule "0 0 * * 0"
    params:
      name: archiver
      namespace: fl-k8s-0078
      schedule: "0 0 * * 0"
  - id: metrics-image
    type: k8s.container-image
    label: DaemonSet metrics collector uses busybox:1.36
    params:
      kind: DaemonSet
      name: metrics
      namespace: fl-k8s-0078
      container: collector
      image: "busybox:1.36"
  - id: metrics-ready
    type: k8s.daemonset-status
    label: DaemonSet metrics has all Pods ready
    params: { name: metrics, namespace: fl-k8s-0078 }
