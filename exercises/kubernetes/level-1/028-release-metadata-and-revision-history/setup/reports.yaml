apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  namespace: fl-k8s-0028
  labels:
    app: reports
  annotations:
    kubernetes.io/change-cause: "initial deploy nginx:1.27"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      labels:
        app: reports
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: nginx:1.27
