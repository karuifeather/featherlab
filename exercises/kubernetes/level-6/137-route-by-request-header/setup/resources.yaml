apiVersion: v1
kind: ConfigMap
metadata:
  name: standard-config
  namespace: fl-k8s-0137
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 'standard-response';
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: premium-config
  namespace: fl-k8s-0137
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 'premium-response';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: standard
  namespace: fl-k8s-0137
  labels:
    app: standard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: standard
  template:
    metadata:
      labels:
        app: standard
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: standard-config
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: standard
  namespace: fl-k8s-0137
spec:
  selector:
    app: standard
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: premium
  namespace: fl-k8s-0137
  labels:
    app: premium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: premium
  template:
    metadata:
      labels:
        app: premium
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: premium-config
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: premium
  namespace: fl-k8s-0137
spec:
  selector:
    app: premium
  ports:
    - port: 80
      targetPort: 80
---
# Grader-owned client Pod for routing probes; learners do not create this.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0137
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gw
  namespace: fl-k8s-0137
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "app.k8s-0137.fl.test"
---
# BUG: The header-match rule references a non-existent Service named "vip".
# Learner task: change the backendRef name from "vip" to "premium".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
  namespace: fl-k8s-0137
spec:
  parentRefs:
    - name: web-gw
  hostnames:
    - "app.k8s-0137.fl.test"
  rules:
    - matches:
        - headers:
            - name: X-User-Type
              value: premium
      backendRefs:
        # WRONG: Service "vip" does not exist; should be "premium"
        - name: vip
          port: 80
    - backendRefs:
        - name: standard
          port: 80
