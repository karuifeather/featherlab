apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: fl-k8s-0110-app
  labels:
    app: catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
# Grader-owned client Pod in the client namespace (fl-k8s-0110), not the app namespace.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0110
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
