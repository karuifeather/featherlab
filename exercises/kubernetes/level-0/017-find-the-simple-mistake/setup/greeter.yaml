# Three ordinary slips: scaled to zero, a typo in the Deployment's label, and the
# check Pod created in the sandbox namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter
  namespace: fl-k8s-0017
  labels: { app: greter }
spec:
  replicas: 0
  selector:
    matchLabels: { app: greeter }
  template:
    metadata:
      labels: { app: greeter }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - { name: web, image: nginx:1.27 }
---
apiVersion: v1
kind: Pod
metadata:
  name: greeter-check
  namespace: fl-k8s-0017-sandbox
  labels: { app: greeter-check }
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - { name: web, image: nginx:1.27 }
