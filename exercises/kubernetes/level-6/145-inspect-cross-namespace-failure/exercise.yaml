schemaVersion: 1
id: k8s-0145
type: task
title: Inspect the Cross-Namespace Failure
summary: Read an HTTPRoute's ResolvedRefs=False condition message to diagnose a missing ReferenceGrant, then fix the issue.
track: kubernetes
level: 6
order: 21
difficulty: intermediate
estimatedMinutes: 12
tags: [gateway-api, cross-namespace, reference-grant, troubleshooting]
prerequisites: [k8s-0144]

environment:
  profile: kind-routing

content:
  description: description.md
  solution: solution.md

requirements:
  - "Namespace: `fl-k8s-0145`"
  - "ReferenceGrant `allow-from-ingress-ns` exists in namespace `fl-k8s-0145-backend`"
  - "HTTPRoute `web-route` in `fl-k8s-0145` has Accepted=True and ResolvedRefs=True"
  - "HTTP request for host `app.k8s-0145.fl.test` reaches the backend and returns `backend-0145`"

hints:
  - 'Read the exact condition message: `kubectl get httproute web-route -n fl-k8s-0145 -o jsonpath=''{.status.parents[0].conditions[?(@.type=="ResolvedRefs")].message}''`'
  - "The message names the missing authorization. The fix is to create a ReferenceGrant in the namespace the message refers to."
  - "The ReferenceGrant must be created in the BACKEND namespace (`fl-k8s-0145-backend`), not in the HTTPRoute's namespace."

lifecycle:
  namespaces: [fl-k8s-0145, fl-k8s-0145-backend]
  setup:
    manifests: [setup/cross-ns.yaml]

checks:
  - id: grant-exists
    type: k8s.resource-exists
    label: ReferenceGrant allow-from-ingress-ns exists in fl-k8s-0145-backend
    params:
      kind: ReferenceGrant
      name: allow-from-ingress-ns
      namespace: fl-k8s-0145-backend
  - id: route-accepted
    type: k8s.httproute-accepted
    label: HTTPRoute web-route is accepted with resolved references
    params:
      name: web-route
      namespace: fl-k8s-0145
      parentRefName: main-gw
  - id: route-probe
    type: k8s.routing-probe
    label: HTTP request for app.k8s-0145.fl.test reaches the backend
    params:
      clientPod: grader-client
      namespace: fl-k8s-0145
      host: app.k8s-0145.fl.test
      path: /
      statusCode: 200
      contains: "backend-0145"
