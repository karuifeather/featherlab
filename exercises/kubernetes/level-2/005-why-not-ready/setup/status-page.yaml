# The readiness probe checks a port nothing listens on, so the Pods never become Ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: fl-k8s-0005
  labels: { app: status-page }
spec:
  replicas: 2
  selector:
    matchLabels: { app: status-page }
  template:
    metadata:
      labels: { app: status-page }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: nginx:1.27
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: status-page
  namespace: fl-k8s-0005
spec:
  selector: { app: status-page }
  ports:
    - { name: http, port: 80, targetPort: http }
