apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fl-k8s-0064
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 5
      initContainers:
        - name: monitor
          image: busybox:1.36
          restartPolicy: Always
          command: ["sh", "-c", "exit 1"]
      containers:
        - name: app
          image: nginx:1.27
