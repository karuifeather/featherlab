# ── Server: api in fl-k8s-0162 ────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0162
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0162
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
# ── Blocked client in fl-k8s-0162 (same namespace as api) ────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: deny-client
  namespace: fl-k8s-0162
  labels:
    app: deny-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sleep", "86400"]
---
# ── Default-deny ingress ───────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: fl-k8s-0162
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# ── Clients in fl-k8s-0162-client ─────────────────────────────────────────────
# authorized-client has role: frontend — should be ALLOWED by the AND policy.
apiVersion: v1
kind: Pod
metadata:
  name: authorized-client
  namespace: fl-k8s-0162-client
  labels:
    app: authorized-client
    role: frontend
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "86400"]
---
# unauthorized-client has role: backend — NOT allowed by the AND policy.
# Listed for manual testing; not used in graded checks.
apiVersion: v1
kind: Pod
metadata:
  name: unauthorized-client
  namespace: fl-k8s-0162-client
  labels:
    app: unauthorized-client
    role: backend
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "86400"]
