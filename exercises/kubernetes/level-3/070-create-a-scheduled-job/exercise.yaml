schemaVersion: 1
id: k8s-0070
type: task
title: Create a Scheduled Job
summary: Create a CronJob that runs a command on a recurring schedule, using the correct schedule syntax and restartPolicy.
track: kubernetes
level: 3
order: 18
difficulty: intermediate
estimatedMinutes: 10
tags: [cronjobs, scheduling, batch]
prerequisites: [k8s-0069]

environment:
  profile: kind-default

content:
  description: description.md
  solution: solution.md

requirements:
  - "Namespace: `fl-k8s-0070`"
  - "CronJob name: `report`"
  - "Schedule: `*/5 * * * *` (every 5 minutes)"

hints:
  - "A CronJob uses `spec.schedule` for the cron expression and `spec.jobTemplate.spec.template.spec.restartPolicy` for the Pod restart policy."
  - "Use `kubectl create cronjob report --image=busybox:1.36 --schedule='*/5 * * * *' --restart=Never -n fl-k8s-0070 -- sh -c 'echo report-$(date +%s)'` to create it imperatively."
  - "Verify with `kubectl get cronjob report -n fl-k8s-0070 -o yaml` and check the `schedule` field."

lifecycle:
  namespaces: [fl-k8s-0070]

checks:
  - id: exists
    type: k8s.resource-in-namespace
    label: CronJob report exists in fl-k8s-0070
    params: { kind: CronJob, name: report, namespace: fl-k8s-0070 }
  - id: schedule
    type: k8s.cronjob-config
    label: CronJob report has schedule "*/5 * * * *"
    params:
      name: report
      namespace: fl-k8s-0070
      schedule: "*/5 * * * *"
