apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0159
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0159
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
# isolated-client: busybox (has wget for http-probe), missing role=frontend
apiVersion: v1
kind: Pod
metadata:
  name: isolated-client
  namespace: fl-k8s-0159
  labels:
    app: isolated-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
---
# deny-client: curl, also missing role=frontend — should remain blocked
apiVersion: v1
kind: Pod
metadata:
  name: deny-client
  namespace: fl-k8s-0159
  labels:
    app: deny-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sh", "-c", "sleep infinity"]
---
# Pre-existing: default-deny all ingress to api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: fl-k8s-0159
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Pre-existing: allow ingress to api from pods with role=frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: fl-k8s-0159
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: frontend
