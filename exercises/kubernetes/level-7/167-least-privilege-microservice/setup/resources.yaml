# ── API server ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: fl-k8s-0167
  labels:
    app: api
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fl-k8s-0167
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
# ── Database server (nginx on port 5432) ──────────────────────────────────────
# nginx is configured to listen on port 5432 so the NetworkPolicy egress rule
# (port 5432) correctly matches the destination pod port. In Kubernetes, NetworkPolicy
# egress port refers to the destination pod's port, not the Service's port.
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: fl-k8s-0167
data:
  default.conf: |
    server {
      listen 5432;
      location / {
        default_type text/plain;
        return 200 'db-response';
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: fl-k8s-0167
  labels:
    app: db
spec:
  terminationGracePeriodSeconds: 5
  volumes:
    - name: config
      configMap:
        name: db-config
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      readinessProbe:
        tcpSocket:
          port: 5432
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: fl-k8s-0167
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
# ── Authorized client (grader-client) ─────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0167
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "86400"]
---
# ── Unauthorized client (deny-client) ─────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: deny-client
  namespace: fl-k8s-0167
  labels:
    app: deny-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sleep", "86400"]
