# Deployment with a broken init container that always exits 1.
# The Pod stays in Init:CrashLoopBackOff and the Deployment never becomes available.
# The learner must patch the init container command to succeed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: fl-k8s-0059
  labels: { app: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      terminationGracePeriodSeconds: 5
      initContainers:
        - name: precheck
          image: busybox:1.36
          command: ["sh", "-c", "exit 1"]
      containers:
        - name: app
          image: nginx:1.27
