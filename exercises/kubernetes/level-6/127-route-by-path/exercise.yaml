schemaVersion: 1
id: k8s-0127
type: task
title: Route by Path
summary: Extend a single-host Ingress with a second path rule so different URL paths reach different Services.
track: kubernetes
level: 6
order: 3
difficulty: intermediate
estimatedMinutes: 12
tags: [ingress, networking, http-routing, path-routing]
prerequisites: [k8s-0126]

environment:
  profile: kind-routing

content:
  description: description.md
  solution: solution.md

requirements:
  - "Namespace `fl-k8s-0127`: Ingress `web` routes `k8s-0127.fl.test/app` (Prefix) to Service `app:80`"
  - "Ingress `web` also routes `k8s-0127.fl.test/api` (Prefix) to Service `api:80`"
  - "HTTP request to `k8s-0127.fl.test/app` returns a response containing `app-response`"
  - "HTTP request to `k8s-0127.fl.test/api` returns a response containing `api-response`"

hints:
  - "Get the current Ingress: `kubectl get ingress web -n fl-k8s-0127 -o yaml`. Add a second item under `spec.rules[0].http.paths` for path `/api` with pathType `Prefix` and backend `api:80`."
  - "Both paths share the same host (`k8s-0127.fl.test`). The idiomatic form is to put both paths under `spec.rules[0].http.paths` in a single rule entry, though adding a second `spec.rules` entry for the same host also works."
  - "Note: Traefik forwards the full URL path to the backend (it does not strip the prefix). The backends in this exercise accept any path and always return their marker string."

lifecycle:
  namespaces: [fl-k8s-0127]
  setup:
    manifests: [setup/resources.yaml]

checks:
  - id: ingress-spec
    type: k8s.ingress-spec
    label: Ingress web routes both /app and /api paths under k8s-0127.fl.test
    params:
      name: web
      namespace: fl-k8s-0127
      ingressClassName: traefik
      rules:
        - host: k8s-0127.fl.test
          path: /app
          pathType: Prefix
          backend:
            serviceName: app
            servicePort: 80
        - host: k8s-0127.fl.test
          path: /api
          pathType: Prefix
          backend:
            serviceName: api
            servicePort: 80
  - id: app-http
    type: k8s.routing-probe
    label: HTTP request to k8s-0127.fl.test/app returns app-response
    params:
      clientPod: grader-client
      namespace: fl-k8s-0127
      host: k8s-0127.fl.test
      path: /app
      contains: app-response
  - id: api-http
    type: k8s.routing-probe
    label: HTTP request to k8s-0127.fl.test/api returns api-response
    params:
      clientPod: grader-client
      namespace: fl-k8s-0127
      host: k8s-0127.fl.test
      path: /api
      contains: api-response
