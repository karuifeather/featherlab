schemaVersion: 1
id: k8s-0054
type: task
title: Run a One-Time Pod
summary: Create a Pod that runs a single command and exits successfully, using restartPolicy Never or OnFailure.
track: kubernetes
level: 3
order: 1
difficulty: intermediate
estimatedMinutes: 8
tags: [pods, restart-policy, one-shot, batch]
prerequisites: [k8s-0053]

environment:
  profile: kind-default

content:
  description: description.md
  solution: solution.md

requirements:
  - "Namespace: `fl-k8s-0054`"
  - "Pod name: `task-runner`"
  - "Container image: `busybox:1.36`"
  - 'Command: `echo "task complete"`'
  - "restartPolicy: `Never` (or `OnFailure` — both allow the Pod to reach `Succeeded`)"
  - "Pod must reach phase `Succeeded`"

hints:
  - "`kubectl run` accepts `--restart=Never` to set restartPolicy Never, and `--command -- <cmd>` to override the entrypoint."
  - "After creating the Pod, check its phase with `kubectl get pod task-runner -n fl-k8s-0054`. A completed Pod shows `Completed` in the STATUS column."
  - "Use `kubectl wait pod/task-runner -n fl-k8s-0054 --for=jsonpath={.status.phase}=Succeeded --timeout=60s` to wait until the phase is Succeeded before grading."

lifecycle:
  namespaces: [fl-k8s-0054]

checks:
  - id: exists
    type: k8s.resource-in-namespace
    label: Pod task-runner exists in fl-k8s-0054
    params: { kind: Pod, name: task-runner, namespace: fl-k8s-0054 }
  - id: image
    type: k8s.container-image
    label: Container uses busybox:1.36
    params: { kind: Pod, name: task-runner, namespace: fl-k8s-0054, image: "busybox:1.36" }
  - id: phase
    type: k8s.pod-phase
    label: Pod phase is Succeeded
    params: { name: task-runner, namespace: fl-k8s-0054, phase: Succeeded }
