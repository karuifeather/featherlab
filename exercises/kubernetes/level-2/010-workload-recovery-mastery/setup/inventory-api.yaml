# Two layered faults: an unpublished image tag, and a readiness probe that names a port the
# container does not define ("web" instead of "http"). Only one replica is requested.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: fl-k8s-0010
  labels: { app: inventory-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: inventory-api }
  template:
    metadata:
      labels: { app: inventory-api }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: api
          image: nginx:1.27-alpne
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: web }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: fl-k8s-0010
spec:
  selector: { app: inventory-api }
  ports:
    - { name: http, port: 80, targetPort: http }
