apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: fl-k8s-0124-data
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: fl-k8s-0124-data
spec:
  selector:
    app: database
  ports:
    - port: 80
      targetPort: 80
