apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fl-k8s-0134
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: fl-k8s-0134
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
# Grader-owned client Pod for routing probes; the learner does not create this.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0134
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gw
  namespace: fl-k8s-0134
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "app.k8s-0134.fl.test"
---
# This HTTPRoute references "wrong-gw" which does not exist.
# The learner must change the parentRef to "main-gw".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
  namespace: fl-k8s-0134
spec:
  parentRefs:
    - name: wrong-gw
  hostnames:
    - "app.k8s-0134.fl.test"
  rules:
    - backendRefs:
        - name: web
          port: 80
