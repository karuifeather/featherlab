apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fl-k8s-0099
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
# Grader-owned client Pod for HTTP probe; the learner does not need to create this.
# It is named "grader-client" so it does not conflict with any client Pod the learner creates.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0099
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
