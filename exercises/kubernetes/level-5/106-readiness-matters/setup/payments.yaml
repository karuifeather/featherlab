apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: fl-k8s-0106
  labels:
    app: payments
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: fl-k8s-0106
spec:
  selector:
    app: payments
  ports:
    - port: 80
      targetPort: 80
