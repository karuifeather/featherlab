schemaVersion: 1
id: kq-k8s-l1-001
activityType: knowledge-check
title: Deployment Anatomy
summary: Test your understanding of how Deployments, ReplicaSets, and Pods relate, and when rollout revisions are created.
track: kubernetes
level: 1
order: 3.5
difficulty: intermediate
estimatedMinutes: 5
tags: [deployments, replicasets, rollouts, pod-templates]
relatedLabs: [k8s-0019, k8s-0020, k8s-0021]
contentRevision: "1.0"

questions:
  - id: q1
    type: single-choice
    prompt: "Which object does a Deployment manage directly?"
    options:
      - id: a
        text: Pods
      - id: b
        text: ReplicaSets
      - id: c
        text: Services
      - id: d
        text: ConfigMaps
    correctAnswer: b
    explanation: "A Deployment manages ReplicaSets, not Pods directly. The ReplicaSet is responsible for ensuring the correct number of Pods are running. When the Deployment's Pod template changes, the Deployment creates a new ReplicaSet."
    wrongExplanations:
      a: "Deployments do not manage Pods directly — that is the ReplicaSet's job. The Deployment creates and updates ReplicaSets, which in turn create Pods."
      c: "Services provide network access to Pods; they are independent of Deployments."
      d: "ConfigMaps store configuration data; they are not managed by a Deployment."
    docRef: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"

  - id: q2
    type: single-choice
    prompt: "Which change to a Deployment creates a new ReplicaSet and increments the rollout revision?"
    options:
      - id: a
        text: Scaling from 2 to 4 replicas
      - id: b
        text: Adding a label to the Deployment's own metadata
      - id: c
        text: Changing the container image in the Pod template
      - id: d
        text: Adding an annotation to the Deployment object
    correctAnswer: c
    explanation: "Only changes to `spec.template` (the Pod template) create a new ReplicaSet and increment the revision. Scaling changes `spec.replicas` only; adding a label or annotation to the Deployment's metadata does not change the template."
    wrongExplanations:
      a: "Scaling adjusts `spec.replicas`, which changes how many Pods run but does not modify the Pod template. No new ReplicaSet is created."
      b: "Labels on the Deployment object itself (`metadata.labels`) are separate from the Pod template labels. Changing them does not affect running Pods."
      d: "Annotations are metadata. Adding them to the Deployment does not change the Pod template and does not trigger a new rollout."
    docRef: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment"

  - id: q3
    type: single-choice
    prompt: "A Deployment has `app=backend` in its `metadata.labels` but NOT in its `spec.template.metadata.labels`. Which statement is true?"
    options:
      - id: a
        text: The Pods will carry the label app=backend automatically
      - id: b
        text: The Pods will NOT carry the label app=backend
      - id: c
        text: The Deployment will fail to start because metadata and template labels must match
      - id: d
        text: The selector will not work without the label on both
    correctAnswer: b
    explanation: "`metadata.labels` apply to the Deployment object itself. `spec.template.metadata.labels` define the labels placed on each Pod. These two sets are independent. A label on the Deployment does not propagate to its Pods."
    wrongExplanations:
      a: "Labels are NOT inherited from the Deployment's own metadata to its Pods. You must add them explicitly to `spec.template.metadata.labels`."
      c: "Kubernetes does not require metadata and template labels to match. The only requirement is that `spec.selector.matchLabels` matches `spec.template.metadata.labels`."
      d: "The selector (`spec.selector.matchLabels`) must match the Pod template labels — not the Deployment's own metadata labels."
    docRef: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#creating-a-deployment"

  - id: q4
    type: single-choice
    prompt: "What does `kubectl rollout status deployment/api -n my-ns` report when a rollout is still in progress?"
    options:
      - id: a
        text: It exits immediately with a summary of the current state
      - id: b
        text: It streams progress until the rollout completes or fails, then exits
      - id: c
        text: It shows only the current revision number
      - id: d
        text: It lists all ReplicaSets owned by the Deployment
    correctAnswer: b
    explanation: "`kubectl rollout status` watches the Deployment and prints progress messages as Pods become available. It exits 0 when the rollout is complete, or non-zero if it fails or times out. This makes it useful in scripts and CI pipelines."
    wrongExplanations:
      a: "The command does not exit immediately on in-progress rollouts — it watches until done."
      c: "Revision numbers are shown with `kubectl rollout history`, not `rollout status`."
      d: "ReplicaSet listings come from `kubectl get replicasets`. `rollout status` reports rollout completion state."
    docRef: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/kubectl_rollout_status/"
    tryCommand: kubectl rollout status deployment/api -n my-ns

  - id: q5
    type: multiple-select
    prompt: "Which TWO conditions must both be true for `k8s.rollout-complete` to pass? (Select two.)"
    options:
      - id: a
        text: All desired replicas are updated to the new Pod template
      - id: b
        text: The Deployment has at least one ReplicaSet
      - id: c
        text: All updated replicas are available (Ready and past minReadySeconds)
      - id: d
        text: The Deployment annotation includes a change-cause entry
    correctAnswers: [a, c]
    explanation: "A rollout is complete when: (1) all replicas are running the new Pod template (`updatedReplicas == desiredReplicas`), and (2) all of those updated Pods are available (`availableReplicas == desiredReplicas`). A ReplicaSet always exists, and change-cause is optional."
    wrongExplanations:
      b: "A ReplicaSet always exists for a Deployment — this is not a discriminating condition for rollout completeness."
      d: "The `kubernetes.io/change-cause` annotation is optional documentation metadata. Its absence does not prevent a rollout from completing."
    docRef: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#complete-deployment"

  - id: q6
    type: single-choice
    prompt: "After creating a brand new Deployment with `replicas: 3`, how many ReplicaSets should `kubectl get replicasets -n ns` show?"
    options:
      - id: a
        text: 0 — ReplicaSets are only created after an image update
      - id: b
        text: 1 — the initial deployment creates exactly one ReplicaSet
      - id: c
        text: 3 — one per replica
      - id: d
        text: 2 — one for the Deployment, one for its Pods
    correctAnswer: b
    explanation: "Every Deployment creates exactly one ReplicaSet for its current Pod template. Three Pods are created, but they all belong to that single ReplicaSet. A second ReplicaSet is created only when the Pod template changes."
    wrongExplanations:
      a: "The very first Deployment creation already produces a ReplicaSet immediately."
      c: "ReplicaSets are per *template*, not per Pod. One ReplicaSet manages all three Pods here."
      d: "There is no 'one for the Deployment' — the Deployment controls one ReplicaSet, which controls the Pods."
    docRef: "https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/"
    tryCommand: kubectl get replicasets -n fl-k8s-0019
