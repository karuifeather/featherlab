apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: fl-k8s-0143
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 'secure-app';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: fl-k8s-0143
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: app-config
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: fl-k8s-0143
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 80
---
# Grader-owned client Pod for routing probes; learners do not create this.
apiVersion: v1
kind: Pod
metadata:
  name: grader-client
  namespace: fl-k8s-0143
  labels:
    app: grader-client
    featherlab.dev/role: grader
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sleep", "86400"]
---
# TLS Secret for the HTTPS listener learner will add.
apiVersion: v1
kind: Secret
metadata:
  name: app-tls
  namespace: fl-k8s-0143
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
# Gateway with HTTP listener only. No HTTPS listener yet.
# The HTTPRoute's parentRef uses sectionName: https, which has no matching listener.
# Baseline: HTTPRoute has NoMatchingParent condition (route not accepted).
# Learner task: add an HTTPS listener named "https" on port 443.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: secure-gw
  namespace: fl-k8s-0143
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "app.k8s-0143.fl.test"
---
# HTTPRoute references the "https" listener by sectionName.
# Fails at baseline because no "https" listener exists on the Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-route
  namespace: fl-k8s-0143
spec:
  parentRefs:
    - name: secure-gw
      sectionName: https
  hostnames:
    - "app.k8s-0143.fl.test"
  rules:
    - backendRefs:
        - name: app
          port: 80
