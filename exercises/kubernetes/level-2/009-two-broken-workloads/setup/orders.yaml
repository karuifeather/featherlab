# orders itself is healthy; its Service selects a label no Pod carries ("order").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: fl-k8s-0009
  labels: { app: orders }
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: nginx:1.27
          ports: [{ name: http, containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: fl-k8s-0009
spec:
  selector: { app: order }
  ports:
    - { name: http, port: 80, targetPort: http }
